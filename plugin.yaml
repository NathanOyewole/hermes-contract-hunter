name: contract-hunter
version: 1.2.0
description: "On-chain contract vulnerability hunter powered by Scout. Radar → surface → prove → report pipeline for EVM bounty programs."
author: "NathanOyewole"
provides_hooks:
  - on_session_start
provides_tools:
  - scout_radar
  - scout_surface
  - scout_prove
  - scout_report
  - scout_status
provides_commands:
  - hunt
config_schema:
  auto_pull_immunefi:
    type: bool
    default: false
    description: "Run an Immunefi radar pull on every session start (blocks startup, makes network calls). Off by default."
